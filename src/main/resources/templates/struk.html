<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Struk Transaksi')}"></head>
<body>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-3xl pos-card overflow-hidden">
            <div class="bg-slate-950 text-white p-8">
                <p class="text-sm font-semibold text-blue-400">Payment Success</p>
                <h1 class="text-3xl font-bold mt-1">Struk Transaksi</h1>
                <p class="text-slate-400 mt-2">Transaksi berhasil disimpan ke riwayat.</p>
            </div>

            <div class="p-8 bg-white">
                <div class="grid md:grid-cols-2 gap-4 mb-8">
                    <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">ID Transaksi</p>
                        <p class="text-xl font-bold text-slate-900" th:text="${transaksi.idTransaksi}"></p>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-5 border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tanggal</p>
                        <p class="text-xl font-bold text-slate-900" th:text="${transaksi.tanggal}"></p>
                    </div>
                </div>

                <div class="border border-slate-200 rounded-3xl overflow-hidden mb-8">
                    <table class="pos-table">
                        <thead>
                            <tr>
                                <th>Nama Barang</th>
                                <th>Harga</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="item : ${transaksi.daftarItem}">
                                <td class="font-semibold" th:text="${item.barang.namaBarang}"></td>
                                <td th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(item.barang.harga)}"></td>
                                <td th:text="${item.qty}"></td>
                                <td class="font-bold" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(item.subtotal)}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="grid md:grid-cols-3 gap-4">
                    <div class="bg-blue-50 rounded-2xl p-5 border border-blue-100">
                        <p class="text-xs font-bold text-blue-500 uppercase tracking-wider">Total Bayar</p>
                        <p class="text-2xl font-bold text-blue-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.totalBayar)}"></p>
                    </div>

                    <div class="bg-orange-50 rounded-2xl p-5 border border-orange-100">
                        <p class="text-xs font-bold text-orange-500 uppercase tracking-wider">Uang Dibayar</p>
                        <p class="text-2xl font-bold text-orange-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(uangDibayar)}"></p>
                    </div>

                    <div class="bg-green-50 rounded-2xl p-5 border border-green-100">
                        <p class="text-xs font-bold text-green-500 uppercase tracking-wider">Kembalian</p>
                        <p class="text-2xl font-bold text-green-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(kembalian)}"></p>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 mt-8">
                    <a href="/transaksi" class="pos-btn-primary">Transaksi Baru</a>
                    <a href="/riwayat-transaksi" class="px-4 py-3 rounded-2xl bg-slate-100 font-semibold text-slate-700">
                        Riwayat Transaksi
                    </a>
                    <a href="/dashboard" class="px-4 py-3 rounded-2xl bg-slate-100 font-semibold text-slate-700">
                        Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
