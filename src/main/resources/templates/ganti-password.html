<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profil & Keamanan')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <div class="min-h-screen flex">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'profil')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto">
            <div class="max-w-3xl mx-auto space-y-8 animate-fade-in-up">
                
                <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.5)]"></span>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Keamanan Akun</span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Ganti Password</h1>
                        <p class="text-slate-500 mt-2 text-sm md:text-base">Perbarui kata sandi Anda secara berkala untuk menjaga keamanan akun.</p>
                    </div>
                </header>

                <p th:if="${error}" th:text="${error}" class="bg-red-50 text-red-600 border border-red-200 p-4 rounded-xl font-medium flex items-center gap-2">
                </p>
                <p th:if="${success}" th:text="${success}" class="bg-green-50 text-green-700 border border-green-200 p-4 rounded-xl font-medium flex items-center gap-2">
                </p>

                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <span class="text-xl">🔐</span> Form Ubah Kata Sandi
                        </h3>
                    </div>

                    <div class="p-8">
                        <form action="/profil/ganti-password" method="post" class="space-y-6">
                            
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Password Saat Ini</label>
                                <input type="password" name="passwordLama" class="pos-input" placeholder="Masukkan password lama Anda" required>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Password Baru</label>
                                    <input type="password" name="passwordBaru" class="pos-input" placeholder="Buat password baru" required>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Konfirmasi Password Baru</label>
                                    <input type="password" name="konfirmasiPassword" class="pos-input" placeholder="Ulangi password baru" required>
                                </div>
                            </div>

                            <div class="pt-6 border-t border-slate-100 flex justify-end">
                                <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-colors flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                    Perbarui Password
                                </button>
                            </div>
                        </form>
                    </div>
                </section>

            </div>
        </main>
    </div>

</body>
</html>
