<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manajemen Pegawai')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <div class="min-h-screen flex">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'pegawai')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto">
            <div class="max-w-6xl mx-auto space-y-8 animate-fade-in-up">
                
                <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.5)]"></span>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">SaaS Management</span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Manajemen Pegawai</h1>
                        <p class="text-slate-500 mt-2 text-sm md:text-base">Kelola akses akun kasir untuk toko Anda.</p>
                    </div>

                    <button onclick="document.getElementById('modalTambah').classList.remove('hidden')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition-colors flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Tambah Kasir Baru
                    </button>
                </header>

                <p th:if="${error}" th:text="${error}" class="bg-red-50 text-red-600 border border-red-200 p-4 rounded-xl font-medium flex items-center gap-2">
                </p>

                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <span class="text-xl">👨‍💼</span> Daftar Akun Pegawai
                        </h3>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                                    <th class="p-4 font-bold w-20">ID</th>
                                    <th class="p-4 font-bold">Username</th>
                                    <th class="p-4 font-bold">Role</th>
                                    <th class="p-4 font-bold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <tr th:each="pegawai, iterStat : ${daftarPegawai}" class="hover:bg-slate-50/50 transition-colors group">
                                    <td class="p-4 font-mono text-sm text-slate-400 font-medium" th:text="'#' + ${iterStat.count}"></td>
                                    <td class="p-4">
                                        <p class="font-bold text-slate-900" th:text="${pegawai.username}"></p>
                                    </td>
                                    <td class="p-4">
                                        <span th:if="${pegawai.role == 'Admin'}" class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200">
                                            Admin/Owner
                                        </span>
                                        <span th:if="${pegawai.role == 'Kasir'}" class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-blue-50 text-blue-700 border border-blue-200">
                                            Kasir
                                        </span>
                                    </td>
                                    <td class="p-4 text-center">
                                        <div th:if="${pegawai.role == 'Kasir'}" class="flex gap-2 justify-center">
                                            <a th:href="@{/pegawai/edit/{id}(id=${pegawai.idUser})}" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 font-bold transition">
                                                Edit
                                            </a>
                                            <a th:href="@{/pegawai/hapus/{id}(id=${pegawai.idUser})}" onclick="return confirm('Apakah Anda yakin ingin menghapus akun kasir ini?');" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 font-bold transition">
                                                Hapus
                                            </a>
                                        </div>
                                        <span th:if="${pegawai.role == 'Admin'}" class="text-slate-400 text-sm font-medium">Tidak dapat dihapus</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal Tambah Kasir -->
    <div id="modalTambah" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="document.getElementById('modalTambah').classList.add('hidden')"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-900">Tambah Akun Kasir</h3>
                <button onclick="document.getElementById('modalTambah').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <form action="/pegawai/tambah" method="post" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kasir</label>
                        <input type="text" name="namaKasir" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="Masukkan nama" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Username Login</label>
                        <input type="text" name="username" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="Username untuk login" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                        <input type="password" name="password" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="Password" required>
                    </div>
                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="document.getElementById('modalTambah').classList.add('hidden')" class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold hover:bg-slate-50 transition">Batal</button>
                        <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30">Simpan Akun</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
