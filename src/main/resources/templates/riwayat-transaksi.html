<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Riwayat Transaksi')}"></head>
<body>

    <div class="min-h-screen">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'riwayat')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
                    <div>
                        <p class="text-sm font-semibold text-blue-600">Transaction History</p>
                        <h1 class="text-3xl font-bold text-slate-900">Riwayat Transaksi</h1>
                        <p class="text-slate-500 mt-1">Lihat daftar transaksi yang sudah berhasil disimpan.</p>
                    </div>

                    <a href="/transaksi" class="pos-btn-primary">
                        + Transaksi Baru
                    </a>
                </div>

                <div class="pos-card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="pos-table">
                            <thead>
                                <tr>
                                    <th>ID Transaksi</th>
                                    <th>Tanggal</th>
                                    <th>Total Bayar</th>
                                    <th>Jumlah Item</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="transaksi : ${daftarTransaksi}">
                                    <td class="font-bold" th:text="${transaksi.idTransaksi}"></td>
                                    <td th:text="${transaksi.tanggal}"></td>
                                    <td class="font-bold" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.totalBayar)}"></td>
                                    <td>
                                        <span class="pos-badge badge-blue" th:text="${transaksi.daftarItem.size() + ' item'}"></span>
                                    </td>
                                    <td>
                                        <a th:href="@{/riwayat-transaksi/detail/{id}(id=${transaksi.idTransaksi})}" class="pos-btn-primary">
                                            Detail
                                        </a>
                                    </td>
                                </tr>

                                <tr th:if="${daftarTransaksi.size() == 0}">
                                    <td colspan="5" class="text-center text-slate-500 py-10">
                                        Belum ada riwayat transaksi.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
