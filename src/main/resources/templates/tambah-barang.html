<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tambah Barang')}"></head>
<body>

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-xl pos-card p-8">
            <p class="text-sm font-semibold text-blue-600">Inventory</p>
            <h1 class="text-3xl font-bold text-slate-900 mt-1 mb-2">Tambah Barang</h1>
            <p class="text-slate-500 mb-8">Masukkan data barang baru ke sistem.</p>

            <form th:action="@{/barang/tambah}" th:object="${barang}" method="post" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Barang</label>
                    <input type="text" th:field="*{namaBarang}" class="pos-input" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Harga</label>
                    <input type="number" th:field="*{harga}" class="pos-input" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Stok</label>
                    <input type="number" th:field="*{stok}" class="pos-input" required>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="pos-btn-primary flex-1">
                        Simpan Barang
                    </button>
                    <a href="/barang" class="px-4 py-3 rounded-2xl bg-slate-100 font-semibold text-slate-700">
                        Batal
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
