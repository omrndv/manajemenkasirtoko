<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tambah Barang')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div class="min-h-screen">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'barang')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto animate-fade-in-up">
            <div class="max-w-2xl mx-auto">
                <a href="/barang" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-blue-600 transition mb-6">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali ke Daftar Barang
                </a>

                <div class="pos-card overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl translate-x-1/2 -translate-y-1/2"></div>
                        <p class="text-sm font-semibold text-blue-200 uppercase tracking-wider mb-1">Inventory Baru</p>
                        <h1 class="text-3xl font-extrabold tracking-tight">Tambah Barang</h1>
                        <p class="text-blue-100 mt-2 font-light">Lengkapi detail produk untuk menambahkannya ke sistem.</p>
                    </div>

                    <div class="p-8 bg-white">
                        <form th:action="@{/barang/tambah}" th:object="${barang}" method="post" class="space-y-6">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Nama Produk / Barang</label>
                                    <input type="text" th:field="*{namaBarang}" class="pos-input" placeholder="Contoh: Kopi Susu Aren" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Kategori (Opsional)</label>
                                    <input type="text" th:field="*{kategori}" id="kategoriInput" class="pos-input" placeholder="Contoh: Minuman Dingin">
                                    <!-- Category Suggestions -->
                                    <div class="mt-2 flex flex-wrap gap-1.5" th:if="${categories.size() > 0}">
                                        <button type="button" th:each="cat : ${categories}" th:text="${cat}" class="px-2.5 py-1 text-[11px] font-semibold bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg border border-slate-200 hover:border-indigo-200 transition duration-200 cursor-pointer" onclick="document.getElementById('kategoriInput').value = this.textContent.trim()"></button>
                                    </div>
                                </div>
                            </div>

                            <!-- Row: Foto Produk -->
                            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6">
                                <label class="block text-sm font-bold text-slate-700 mb-2">Foto Produk (Opsional)</label>
                                <div class="flex flex-col md:flex-row gap-6 items-center">
                                    <!-- Preview Area -->
                                    <div class="w-32 h-32 rounded-2xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shrink-0 relative shadow-sm">
                                        <img id="imagePreview" class="hidden w-full h-full object-cover" />
                                        <div id="imagePlaceholder" class="text-center text-slate-400 p-2">
                                            <svg class="w-8 h-8 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            <span class="text-[10px] font-bold uppercase tracking-wider">No Image</span>
                                        </div>
                                    </div>
                                    
                                    <!-- Upload Controls -->
                                    <div class="flex-1 w-full">
                                        <input type="file" id="imageFileInput" accept="image/*" class="hidden">
                                        <button type="button" onclick="document.getElementById('imageFileInput').click()" class="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-bold rounded-xl transition flex items-center gap-2 mb-2 shadow-sm">
                                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4-4m4 4V4"></path></svg>
                                            Pilih Foto Barang
                                        </button>
                                        <p class="text-xs text-slate-500">Mendukung format JPG, PNG, atau GIF. Maksimal ukuran 2MB.</p>
                                        
                                        <!-- Hidden Input for Base64 -->
                                        <input type="hidden" th:field="*{gambar}" id="gambarBase64">
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Harga Modal (Rp)</label>
                                    <div class="relative">
                                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">Rp</span>
                                        <input type="number" th:field="*{hargaModal}" class="pos-input pl-10" placeholder="0" required>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Harga Jual (Rp)</label>
                                    <div class="relative">
                                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">Rp</span>
                                        <input type="number" th:field="*{harga}" class="pos-input pl-10" placeholder="0" required>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-2">Stok Awal</label>
                                    <input type="number" th:field="*{stok}" class="pos-input" placeholder="0" required>
                                </div>
                            </div>

                            <div class="pt-6 border-t border-slate-100 flex gap-4 items-center justify-end">
                                <a href="/barang" class="px-6 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 transition">
                                    Batal
                                </a>
                                <button type="submit" class="pos-btn-primary px-8 py-3 flex items-center gap-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                    Simpan Produk
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const fileInput = document.getElementById('imageFileInput');
            const base64Input = document.getElementById('gambarBase64');
            const imagePreview = document.getElementById('imagePreview');
            const imagePlaceholder = document.getElementById('imagePlaceholder');

            if (fileInput) {
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const base64String = event.target.result;
                            base64Input.value = base64String;
                            imagePreview.src = base64String;
                            imagePreview.classList.remove('hidden');
                            imagePlaceholder.classList.add('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }
        });
    </script>
</body>
</html>
