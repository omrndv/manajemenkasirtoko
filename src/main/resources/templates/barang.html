<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Data Barang')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <div class="min-h-screen flex">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'barang')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto">
            <div class="max-w-6xl mx-auto space-y-8 animate-fade-in-up">
                
                <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Manajemen Inventaris</span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Data Barang</h1>
                        <p class="text-slate-500 mt-2 text-sm md:text-base">Kelola data produk, perbarui harga, dan pantau stok toko.</p>
                    </div>

                    <a href="/barang/tambah" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-sm transition-colors flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Tambah Barang Baru
                    </a>
                </header>

                <!-- Category Filter Pills -->
                <div id="categoryFilters" class="flex flex-wrap gap-2 animate-fade-in-up"></div>

                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <span class="text-xl">📦</span> Daftar Produk
                        </h3>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                                    <th class="p-4 font-bold w-20">ID</th>
                                    <th class="p-4 font-bold">Produk & Kategori</th>
                                    <th class="p-4 font-bold">Harga Modal</th>
                                    <th class="p-4 font-bold">Harga Jual</th>
                                    <th class="p-4 font-bold">Status Stok</th>
                                    <th class="p-4 font-bold text-right w-32">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                <tr th:each="barang, iterStat : ${daftarBarang}" class="hover:bg-slate-50/50 transition-colors group">
                                    <td class="p-4 font-mono text-sm text-slate-400 font-medium" th:text="${iterStat.count}"></td>
                                    <td class="p-4">
                                        <div class="flex items-center gap-3">
                                            <!-- Product Image Thumbnail -->
                                            <div class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center shrink-0">
                                                <img th:if="${barang.gambar != null && !#strings.isEmpty(barang.gambar)}" th:src="${barang.gambar}" class="w-full h-full object-cover" />
                                                <div th:if="${barang.gambar == null || #strings.isEmpty(barang.gambar)}" class="w-full h-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm">
                                                    <span th:text="${#strings.substring(barang.namaBarang, 0, 1)}"></span>
                                                </div>
                                            </div>
                                            <div>
                                                <p class="font-bold text-slate-800" th:text="${barang.namaBarang}"></p>
                                                <button class="category-pill inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-50 text-indigo-700 border border-indigo-100 hover:bg-indigo-100 transition mt-1"
                                                        th:text="${barang.kategori != null && !#strings.isEmpty(barang.kategori) ? barang.kategori : 'Umum'}"
                                                        onclick="filterByCategory(this.textContent.trim())">
                                                </button>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="p-4">
                                        <p class="font-bold text-slate-500" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(barang.hargaModal)}"></p>
                                    </td>
                                    <td class="p-4">
                                        <p class="font-bold text-indigo-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(barang.harga)}"></p>
                                    </td>
                                    <td class="p-4">
                                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200" th:if="${barang.stok > 5}" th:text="${barang.stok + ' Unit'}"></span>
                                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-orange-50 text-orange-700 border border-orange-200" th:if="${barang.stok > 0 and barang.stok <= 5}" th:text="${barang.stok + ' Unit (Menipis)'}"></span>
                                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-red-50 text-red-700 border border-red-200" th:if="${barang.stok <= 0}">Habis</span>
                                    </td>
                                    <td class="p-4">
                                        <div class="flex gap-2 justify-end opacity-0 group-hover:opacity-100 transition-opacity">
                                            <a th:href="@{/barang/edit/{id}(id=${barang.idBarang})}" class="p-2 text-amber-600 bg-amber-50 hover:bg-amber-500 hover:text-white rounded-lg transition" title="Edit">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                            </a>
                                            <a th:href="@{/barang/hapus/{id}(id=${barang.idBarang})}"
                                               onclick="return confirm('Peringatan: Anda yakin ingin menghapus data barang ini secara permanen?')"
                                               class="p-2 text-rose-600 bg-rose-50 hover:bg-rose-500 hover:text-white rounded-lg transition" title="Hapus">
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${daftarBarang.size() == 0}">
                                    <td colspan="6" class="py-16 text-center">
                                        <div class="flex flex-col items-center justify-center">
                                            <span class="text-4xl mb-4">📭</span>
                                            <p class="text-lg font-bold text-slate-700">Belum ada data barang</p>
                                            <p class="text-sm text-slate-500 mt-1">Silakan klik tombol "Tambah Barang Baru"</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tableRows = document.querySelectorAll("tbody tr");
            const filterContainer = document.getElementById("categoryFilters");
            
            if (!filterContainer || tableRows.length === 0) return;

            // Extract unique categories
            const categories = new Set();
            tableRows.forEach(row => {
                const categoryBtn = row.querySelector(".category-pill");
                if (categoryBtn) {
                    categories.add(categoryBtn.textContent.trim());
                }
            });

            // If there are no custom categories, don't show filters
            if (categories.size <= 1 && categories.has("Umum")) return;

            // Render "Semua" button
            const createFilterBtn = (text, active = false) => {
                const btn = document.createElement("button");
                btn.className = `px-4 py-2 rounded-xl text-sm font-bold border transition duration-200 ${
                    active 
                    ? "bg-indigo-600 border-indigo-600 text-white shadow-sm" 
                    : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
                }`;
                btn.textContent = text;
                btn.addEventListener("click", () => {
                    // Update active styles
                    filterContainer.querySelectorAll("button").forEach(b => {
                        b.className = "px-4 py-2 rounded-xl text-sm font-bold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition duration-200";
                    });
                    btn.className = "px-4 py-2 rounded-xl text-sm font-bold border border-indigo-600 bg-indigo-600 text-white shadow-sm transition duration-200";
                    
                    // Filter table rows
                    tableRows.forEach(row => {
                        const categoryBtn = row.querySelector(".category-pill");
                        if (!categoryBtn) return;
                        const catText = categoryBtn.textContent.trim();
                        if (text === "Semua" || catText === text) {
                            row.style.display = "";
                        } else {
                            row.style.display = "none";
                        }
                    });
                });
                return btn;
            };

            // Add "Semua" button
            filterContainer.appendChild(createFilterBtn("Semua", true));

            // Add category buttons
            categories.forEach(cat => {
                filterContainer.appendChild(createFilterBtn(cat));
            });
        });

        function filterByCategory(categoryName) {
            const filterContainer = document.getElementById("categoryFilters");
            if (!filterContainer) return;
            
            const buttons = filterContainer.querySelectorAll("button");
            buttons.forEach(btn => {
                if (btn.textContent.trim() === categoryName) {
                    btn.click();
                }
            });
        }
    </script>
</body>
</html>
