<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Sistem Kasir Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">

    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-amber-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-orange-500 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 animate-pulse delay-700"></div>

    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden z-10 animate-fade-in-up">
        
        <div class="p-8">
            <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mb-6 border border-amber-100 shadow-sm mx-auto">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Lupa Password?</h2>
                <p class="text-slate-500 mt-2 text-sm">Jangan khawatir! Masukkan username Anda dan kontak toko yang terdaftar untuk memverifikasi identitas, lalu sistem akan mereset password ke default (123456).</p>
            </div>

            <p th:if="${error}" th:text="${error}" class="mb-6 bg-red-50 text-red-600 border border-red-200 rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2">
            </p>

            <form action="/lupa-password" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Username Anda</label>
                    <input type="text" name="username" class="pos-input text-center" placeholder="Masukkan username" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Kontak Toko / Merchant</label>
                    <input type="text" name="kontak" class="pos-input text-center" placeholder="Masukkan nomor telepon/email toko" required>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-md transition mt-2">
                    Reset Password
                </button>
            </form>
            
            <div class="mt-8 text-center border-t border-slate-100 pt-6">
                <a href="/login" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-slate-800 transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Kembali ke halaman Login
                </a>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
