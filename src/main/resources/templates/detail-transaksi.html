<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detail Transaksi')}"></head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <div class="min-h-screen">
        <aside th:replace="~{fragments/layout :: sidebar(${user}, 'riwayat')}"></aside>

        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto animate-fade-in-up">
            <div class="max-w-5xl mx-auto">
                
                <a href="/riwayat-transaksi" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-indigo-600 transition mb-6">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali ke Riwayat
                </a>

                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <p class="text-sm font-bold text-indigo-600 uppercase tracking-wider">Transaction Detail</p>
                        </div>
                        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Detail Nota</h1>
                    </div>

                    <a th:href="@{/struk/{id}(id=${transaksi.idTransaksi})}" target="_blank" class="pos-btn-primary flex items-center gap-2 shadow-lg shadow-blue-500/30">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Cetak Struk
                    </a>
                </div>

                <div class="grid md:grid-cols-3 gap-6 mb-8">
                    <div class="pos-card p-6 border-l-4 border-l-slate-400">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">ID Transaksi</p>
                        <p class="text-2xl font-black text-slate-900 font-mono" th:text="'#' + ${transaksi.idTransaksi}"></p>
                    </div>

                    <div class="pos-card p-6 border-l-4 border-l-blue-400">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Tanggal</p>
                        <p class="text-2xl font-bold text-slate-900" th:text="${transaksi.tanggal}"></p>
                    </div>

                    <div class="pos-card p-6 border-l-4 border-l-emerald-400 bg-emerald-50/50">
                        <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-1">Total Bayar</p>
                        <p class="text-2xl font-black text-emerald-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.totalBayar)}"></p>
                    </div>
                </div>

                <div class="pos-card overflow-hidden">
                    <div class="p-6 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="text-lg font-bold text-slate-800">Daftar Barang Dibeli</h2>
                    </div>

                    <div class="pos-table-container rounded-none border-x-0 border-b-0">
                        <table class="pos-table">
                            <thead>
                                <tr>
                                    <th>Nama Produk</th>
                                    <th>Harga Satuan</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${transaksi.daftarItem}">
                                    <td>
                                        <p class="font-bold text-slate-800" th:text="${item.barang.namaBarang}"></p>
                                    </td>
                                    <td>
                                        <p class="text-slate-600" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(item.barang.harga)}"></p>
                                    </td>
                                    <td class="text-center">
                                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-50 text-indigo-700 font-bold" th:text="${item.qty}"></span>
                                    </td>
                                    <td class="text-right">
                                        <p class="font-black text-slate-900" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(item.subtotal)}"></p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="p-6 bg-slate-50 border-t border-slate-200">
                        <div class="flex justify-end">
                            <div class="w-80 space-y-3">
                                <div class="flex justify-between items-center text-sm">
                                    <p class="text-slate-500 font-medium">Subtotal</p>
                                    <p class="font-bold text-slate-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.totalBayar + transaksi.diskon - transaksi.pajakPpn)}"></p>
                                </div>
                                <div th:if="${transaksi.diskon > 0}" class="flex justify-between items-center text-sm">
                                    <p class="text-slate-500 font-medium">Diskon</p>
                                    <p class="font-bold text-rose-600" th:text="'- ' + ${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.diskon)}"></p>
                                </div>
                                <div th:if="${transaksi.pajakPpn > 0}" class="flex justify-between items-center text-sm">
                                    <p class="text-slate-500 font-medium">Pajak PPN</p>
                                    <p class="font-bold text-blue-600" th:text="'+ ' + ${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.pajakPpn)}"></p>
                                </div>
                                <div class="flex justify-between items-center border-t border-slate-200 pt-2 text-sm">
                                    <p class="text-slate-800 font-bold">Total Harga</p>
                                    <p class="font-black text-slate-900" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.totalBayar)}"></p>
                                </div>
                                <div class="flex justify-between items-center text-sm">
                                    <p class="text-slate-500 font-medium">Uang Dibayar</p>
                                    <p class="font-bold text-slate-700" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.uangDibayar)}"></p>
                                </div>
                                <div class="pt-3 border-t border-dashed border-slate-300 flex justify-between items-center">
                                    <p class="font-bold text-slate-800">Kembalian</p>
                                    <p class="font-black text-emerald-600 text-lg" th:text="${T(com.kasir.manajemenkasir.util.FormatRupiah).format(transaksi.uangDibayar - transaksi.totalBayar)}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
