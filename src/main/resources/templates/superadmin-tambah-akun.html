<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Akun Baru - KasirPro Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden">

    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <aside class="pos-sidebar fixed left-0 top-0 h-screen w-72 hidden md:flex flex-col p-6 z-40 bg-slate-900 text-white">
            <div class="mb-12 mt-2">
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-50 to-purple-600 flex items-center justify-center text-xl font-bold shadow-lg shadow-indigo-500/20 border border-white/10">
                        S
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight text-white">KasirPro</h1>
                        <p class="text-xs text-indigo-300 font-semibold uppercase tracking-wider">Superadmin</p>
                    </div>
                </div>
            </div>

            <nav class="space-y-1">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 px-2">Menu Utama</p>
                <a href="/superadmin/dashboard" class="pos-menu hover:bg-white/5 text-slate-300">
                    <i data-lucide="activity" class="w-5 h-5 shrink-0"></i>
                    Log Aktivitas
                </a>
                <a href="/superadmin/accounts" class="pos-menu pos-menu-active">
                    <i data-lucide="users" class="w-5 h-5 shrink-0 text-white"></i>
                    Kelola Akun
                </a>
            </nav>

            <div class="mt-auto border-t border-white/10 pt-6">
                <div class="flex items-center gap-3 px-2 mb-4">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center font-bold text-lg border border-indigo-500/30">
                        SA
                    </div>
                    <div>
                        <p class="text-sm font-bold text-white truncate">Superadmin</p>
                        <p class="text-xs text-indigo-300 font-medium truncate">Owner</p>
                    </div>
                </div>
                <a href="/logout" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/20 rounded-xl font-bold transition-all text-sm">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Keluar Sistem
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 md:ml-72 p-6 md:p-10 min-h-screen overflow-y-auto bg-slate-50">
            <div class="max-w-3xl mx-auto space-y-8 animate-fade-in-up">
                
                <!-- Back link -->
                <div>
                    <a href="/superadmin/accounts" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-indigo-600 transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Kelola Akun
                    </a>
                </div>

                <!-- Header -->
                <header class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.5)]"></span>
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Create Account</span>
                    </div>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Tambah Akun Baru</h1>
                    <p class="text-slate-500 mt-2 text-sm">Buat akun Admin atau Kasir baru dan pasangkan ke salah satu merchant.</p>
                </header>

                <!-- Form Section -->
                <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                    <p th:if="${error}" th:text="${error}" class="mb-6 bg-red-50 text-red-600 border border-red-200 rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2">
                    </p>

                    <form action="/superadmin/accounts/tambah" method="post" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                                <input type="text" name="username" class="pos-input" placeholder="Pilih username" required>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                                <input type="password" name="password" class="pos-input" placeholder="Masukkan password" required>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Lengkap Pemegang Akun</label>
                                <input type="text" name="namaLengkap" class="pos-input" placeholder="Masukkan nama lengkap" required>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Role / Peran Akun</label>
                                <select name="role" class="pos-input bg-white" required>
                                    <option value="Admin">Admin (Pemilik Toko)</option>
                                    <option value="Kasir">Kasir (Pegawai)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Pasangkan ke Toko / Merchant</label>
                                <select name="idToko" class="pos-input bg-white" required>
                                    <option value="" disabled selected>Pilih toko merchant</option>
                                    <option th:each="t : ${daftarToko}" th:value="${t.idToko}" th:text="${t.namaToko}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="pt-6 border-t border-slate-100 flex gap-4">
                            <button type="submit" class="flex-1 pos-btn-primary py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 font-bold text-white shadow-md rounded-xl transition">
                                Simpan Akun Baru
                            </button>
                            <a href="/superadmin/accounts" class="px-6 py-3 bg-slate-100 hover:bg-slate-250 text-slate-600 rounded-xl font-bold transition text-center shadow-sm">
                                Batal
                            </a>
                        </div>
                    </form>
                </section>

            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
